services:
  eval:
    image: python:3.12-slim
    working_dir: /course/solutions/evals
    entrypoint: ["python", "cli.py"]
    env_file:
      - path: .env
        required: false
    environment:
      SET: golden
      GATE: daily
      PYTHONDONTWRITEBYTECODE: "1"
      SERVICE_URL: ${EVAL_STAND_URL:-http://host.docker.internal:8000}
    volumes:
      - .:/course/solutions/evals
      - ${STAND_DIR:-../paypilot-stand-shared-db}/app:/course/app:ro
    extra_hosts:
      - host.docker.internal:host-gateway
